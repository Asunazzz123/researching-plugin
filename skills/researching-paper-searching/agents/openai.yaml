interface:
  display_name: "Paper Searching"
  short_description: "Find papers, resolve access, and record project PDFs"
  default_prompt: "Use $researching-paper-searching to find and access papers relevant to my current research context, then record downloaded PDFs in my research folder."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "alphaxiv-arxiv"
      description: "Read-oriented alphaXiv MCP bridge for arXiv discovery and paper reading"
      transport: "stdio"
